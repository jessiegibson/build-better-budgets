{% extends "base.html" %}

{% block title %}Edit Tax Item - Budget App{% endblock %}

{% block content %}
<div class="row mb-4">
    <div class="col-12">
        <nav aria-label="breadcrumb">
            <ol class="breadcrumb">
                <li class="breadcrumb-item"><a href="/">Dashboard</a></li>
                <li class="breadcrumb-item"><a href="{{ url_for('tax_depreciation') }}">Section 179 & Depreciation</a></li>
                <li class="breadcrumb-item active">Edit Tax Item</li>
            </ol>
        </nav>
        <h1 class="display-5 mb-4">
            <i class="fas fa-edit me-2"></i>Edit Tax Item
        </h1>
    </div>
</div>

<div class="row mb-4">
    <div class="col-md-8 mx-auto">
        <div class="card">
            <div class="card-header">
                <h5>Edit Item</h5>
            </div>
            <div class="card-body">
                <form method="POST" action="{{ url_for('edit_tax_item', item_id=item.id) }}">
                    <div class="mb-3">
                        <label for="description" class="form-label">Description</label>
                        <input type="text" class="form-control" id="description" name="description" 
                               value="{{ item.description }}" required>
                    </div>
                    
                    <div class="row mb-3">
                        <div class="col-md-6">
                            <label for="purchase_date" class="form-label">Purchase Date</label>
                            <input type="date" class="form-control" id="purchase_date" name="purchase_date" 
                                   value="{{ item.purchase_date }}" required>
                        </div>
                        <div class="col-md-6">
                            <label for="amount" class="form-label">Amount</label>
                            <div class="input-group">
                                <span class="input-group-text">$</span>
                                <input type="number" class="form-control" id="amount" name="amount" step="0.01" min="0" 
                                       value="{{ item.amount }}" required>
                            </div>
                        </div>
                    </div>
                    
                    <div class="row mb-3">
                        <div class="col-md-6">
                            <label for="business_use_percentage" class="form-label">Business Use %</label>
                            <div class="input-group">
                                <input type="number" class="form-control" id="business_use_percentage" 
                                       name="business_use_percentage" min="1" max="100" 
                                       value="{{ item.business_use_percentage }}">
                                <span class="input-group-text">%</span>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <label for="depreciation_years" class="form-label">Dep. Period (Years)</label>
                            <select class="form-select" id="depreciation_years" name="depreciation_years" required>
                                <option value="5" {% if item.depreciation_years == 5 %}selected{% endif %}>5 years (equipment, computers)</option>
                                <option value="7" {% if item.depreciation_years == 7 %}selected{% endif %}>7 years (furniture, fixtures)</option>
                                <option value="15" {% if item.depreciation_years == 15 %}selected{% endif %}>15 years (land improvements)</option>
                                <option value="27.5" {% if item.depreciation_years == 27.5 %}selected{% endif %}>27.5 years (residential property)</option>
                                <option value="39" {% if item.depreciation_years == 39 %}selected{% endif %}>39 years (commercial property)</option>
                            </select>
                        </div>
                    </div>
                    
                    <div class="mb-3">
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" id="use_section_179" name="use_section_179" 
                                   {% if item.use_section_179 %}checked{% endif %}>
                            <label class="form-check-label" for="use_section_179">
                                Elect Section 179 deduction
                            </label>
                        </div>
                    </div>
                    
                    <div class="mb-3">
                        <label for="notes" class="form-label">Notes</label>
                        <textarea class="form-control" id="notes" name="notes" rows="3">{{ item.notes }}</textarea>
                    </div>
                    
                    <div class="d-flex justify-content-between">
                        <a href="{{ url_for('tax_depreciation') }}" class="btn btn-secondary">Cancel</a>
                        <button type="submit" class="btn btn-primary">Update Item</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
